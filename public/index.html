<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Generator & Device Manager</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f0f2f5; display: flex; justify-content: center; padding: 40px; }
        .card { background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 420px; margin-bottom: 20px; }
        input, select, button { width: 100%; padding: 12px; margin-top: 10px; border-radius: 6px; border: 1px solid #ccc; box-sizing: border-box; }
        button { cursor: pointer; font-weight: bold; transition: opacity 0.2s; }
        button:disabled { opacity: 0.6; cursor: not-allowed; }
        .btn-green { background: #138852; color: white; border: none; }
        .btn-blue { background: #0066ff; color: white; border: none; }
        .btn-copy { background: #4a5568; color: white; border: none; margin-top: 8px; }
        .status { margin-top: 15px; padding: 12px; border-radius: 6px; display: none; text-align: center; font-size: 14px; }
        .status.success { background: #d1e7dd; color: #0f5132; display: block; }
        .status.error { background: #f8d7da; color: #842029; display: block; }
        .email-display { font-weight: bold; word-break: break-all; }
    </style>
</head>
<body>
    <div>
        <div class="card">
            <h3>1. Generate Valid Emails</h3>
            <input type="number" id="count" value="10" min="1" max="100">
            <select id="domain">
                <option value="all">All Domains (21 Domains Randomly)</option>
                <option value="gmail.com">gmail.com</option>
                <option value="yahoo.com">yahoo.com</option>
                <option value="outlook.com">outlook.com</option>
                <option value="hotmail.com">hotmail.com</option>
                <option value="icloud.com">icloud.com</option>
                <option value="aol.com">aol.com</option>
                <option value="zoho.com">zoho.com</option>
                <option value="proton.me">proton.me</option>
                <option value="mail.com">mail.com</option>
                <option value="gmx.com">gmx.com</option>
                <option value="yandex.com">yandex.com</option>
                <option value="live.com">live.com</option>
                <option value="msn.com">msn.com</option>
                <option value="comcast.net">comcast.net</option>
                <option value="sbcglobal.net">sbcglobal.net</option>
                <option value="verizon.net">verizon.net</option>
                <option value="att.net">att.net</option>
                <option value="me.com">me.com</option>
                <option value="mac.com">mac.com</option>
                <option value="rocketmail.com">rocketmail.com</option>
                <option value="cox.net">cox.net</option>
            </select>
            <button id="genBtn" class="btn-green" onclick="generateEmails()">Generate Emails</button>
            <div id="genStatus" class="status"></div>
        </div>

        <div class="card">
            <h3>2. Assign Email for Device</h3>
            <input type="text" id="deviceId" readonly>
            <button id="getBtn" class="btn-blue" onclick="getEmail()">Get New Email</button>
            <div id="assignStatus" class="status"></div>
            <button id="copyBtn" class="btn-copy" style="display:none;" onclick="copyToClipboard()">Copy Email</button>
        </div>
    </div>

    <script>
        let rawDeviceId = localStorage.getItem('device_id');
        if (!rawDeviceId) {
            rawDeviceId = 'DEV-' + Math.random().toString(36).substring(2, 10).toUpperCase() + '-' + Date.now();
            localStorage.setItem('device_id', rawDeviceId);
        }
        document.getElementById('deviceId').value = `Device ID: ${rawDeviceId}`;

        let currentAssignedEmail = '';

        async function generateEmails() {
            const statusDiv = document.getElementById('genStatus');
            const genBtn = document.getElementById('genBtn');

            genBtn.disabled = true;
            statusDiv.className = 'status';
            statusDiv.innerText = 'Validating MX Records & Generating...';
            statusDiv.style.display = 'block';

            const count = document.getElementById('count').value;
            const domain = document.getElementById('domain').value;

            try {
                const res = await fetch('/api/generate-emails', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ count, domain })
                });
                const data = await res.json();
                if (data.success) {
                    statusDiv.className = 'status success';
                    statusDiv.innerText = data.message;
                } else {
                    statusDiv.className = 'status error';
                    statusDiv.innerText = data.error;
                }
            } catch (err) {
                statusDiv.className = 'status error';
                statusDiv.innerText = 'Server error. Please retry.';
            } finally {
                genBtn.disabled = false;
            }
        }

        async function getEmail() {
            const statusDiv = document.getElementById('assignStatus');
            const getBtn = document.getElementById('getBtn');
            const copyBtn = document.getElementById('copyBtn');

            getBtn.disabled = true;
            statusDiv.className = 'status';
            statusDiv.innerText = 'Fetching...';
            statusDiv.style.display = 'block';

            try {
                const res = await fetch('/api/get-email', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ deviceId: rawDeviceId })
                });
                const data = await res.json();
                if (data.success) {
                    currentAssignedEmail = data.email;
                    statusDiv.className = 'status success';
                    statusDiv.innerHTML = `Assigned Email: <span class="email-display">${data.email}</span>`;
                    copyBtn.style.display = 'block';
                    copyBtn.innerText = 'Copy Email';
                } else {
                    statusDiv.className = 'status error';
                    statusDiv.innerText = data.error;
                    copyBtn.style.display = 'none';
                }
            } catch (err) {
                statusDiv.className = 'status error';
                statusDiv.innerText = 'Connection error.';
                copyBtn.style.display = 'none';
            } finally {
                getBtn.disabled = false;
            }
        }

        function copyToClipboard() {
            if (!currentAssignedEmail) return;
            navigator.clipboard.writeText(currentAssignedEmail).then(() => {
                const copyBtn = document.getElementById('copyBtn');
                copyBtn.innerText = 'Copied!';
                setTimeout(() => { copyBtn.innerText = 'Copy Email'; }, 2000);
            });
        }
    </script>
</body>
</html>
