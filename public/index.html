<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Manager Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; padding: 20px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 500px; display: flex; flex-direction: column; gap: 20px; }
        .card { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h2 { margin-top: 0; font-size: 1.2rem; color: #333; }
        input, select, button { width: 100%; padding: 10px; margin-top: 10px; border-radius: 5px; border: 1px solid #ccc; box-sizing: border-box; }
        button { border: none; color: white; cursor: pointer; font-weight: bold; }
        .btn-green { background-color: #13834b; }
        .btn-blue { background-color: #0066ff; }
        .btn-gray { background-color: #4b5563; }
        .status { margin-top: 10px; padding: 10px; border-radius: 5px; display: none; font-size: 0.9rem; font-weight: bold; text-align: center; }
        .status.success { background-color: #d1e7dd; color: #0f5132; display: block; }
        .status.error { background-color: #f8d7da; color: #842029; display: block; }
    </style>
</head>
<body>

<div class="container">
    <!-- Section 1 -->
    <div class="card">
        <h2>1. Scrape Real Emails</h2>
        <input type="text" id="targetInput" placeholder="Target keyword (e.g. marketing, crypto)" value="marketing">
        <select id="domainSelect">
            <option value="all">All Domains (21 Domains Randomly)</option>
            <option value="gmail.com">gmail.com</option>
            <option value="yahoo.com">yahoo.com</option>
            <option value="outlook.com">outlook.com</option>
            <option value="hotmail.com">hotmail.com</option>
            <option value="icloud.com">icloud.com</option>
            <option value="aol.com">aol.com</option>
            <option value="protonmail.com">protonmail.com</option>
            <option value="zoho.com">zoho.com</option>
            <option value="yandex.com">yandex.com</option>
            <option value="mail.com">mail.com</option>
            <option value="gmx.com">gmx.com</option>
            <option value="hubspot.com">hubspot.com</option>
            <option value="mailchimp.com">mailchimp.com</option>
            <option value="sendgrid.com">sendgrid.com</option>
            <option value="fastmail.com">fastmail.com</option>
            <option value="tutanota.com">tutanota.com</option>
            <option value="runbox.com">runbox.com</option>
            <option value="hushmail.com">hushmail.com</option>
            <option value="lycos.com">lycos.com</option>
            <option value="zohomail.com">zohomail.com</option>
            <option value="inbox.com">inbox.com</option>
        </select>
        <input type="number" id="emailCount" value="10" min="1" max="50">
        <button id="scrapeBtn" class="btn-green" onclick="generateEmails()">Scrape Real Emails</button>
        <div id="genStatus" class="status"></div>
    </div>

    <!-- Section 2 -->
    <div class="card">
        <h2>2. Assign Email for Device</h2>
        <input type="text" id="deviceId" readonly>
        <button class="btn-blue" onclick="getNewEmail()">Get New Email</button>
        <div id="assignedEmailStatus" class="status"></div>
        <button class="btn-gray" onclick="copyEmail()">Copy Email</button>
    </div>
</div>

<script>
    // System Unique Device ID Generator
    function initDeviceId() {
        let devId = localStorage.getItem('device_id');
        if (!devId) {
            devId = 'DEV-' + Math.random().toString(36).substring(2, 9).toUpperCase() + '-' + Date.now();
            localStorage.setItem('device_id', devId);
        }
        document.getElementById('deviceId').value = 'Device ID: ' + devId;
    }
    initDeviceId();

    async function generateEmails() {
        const count = document.getElementById('emailCount').value;
        const domain = document.getElementById('domainSelect').value;
        const target = document.getElementById('targetInput').value;
        const statusDiv = document.getElementById('genStatus');
        const scrapeBtn = document.getElementById('scrapeBtn');

        scrapeBtn.disabled = true;
        scrapeBtn.innerText = "Scraping...";
        statusDiv.className = 'status';

        try {
            const res = await fetch('/api/generate-emails', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ count, domain, target })
            });
            const data = await res.json();
            
            if (data.success) {
                statusDiv.className = 'status success';
                statusDiv.innerText = data.message;
            } else {
                statusDiv.className = 'status error';
                statusDiv.innerText = data.error || 'Failed to scrape.';
            }
        } catch (e) {
            statusDiv.className = 'status error';
            statusDiv.innerText = 'Server error occurred.';
        } finally {
            scrapeBtn.disabled = false;
            scrapeBtn.innerText = "Scrape Real Emails";
        }
    }

    async function getNewEmail() {
        const devIdFull = document.getElementById('deviceId').value;
        const deviceId = devIdFull.replace('Device ID: ', '');
        const statusDiv = document.getElementById('assignedEmailStatus');

        try {
            const res = await fetch('/api/get-email', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ deviceId })
            });
            const data = await res.json();

            if (data.success) {
                statusDiv.className = 'status success';
                statusDiv.innerText = 'Assigned Email: ' + data.email;
            } else {
                statusDiv.className = 'status error';
                statusDiv.innerText = data.error || 'No email available.';
            }
        } catch (e) {
            statusDiv.className = 'status error';
            statusDiv.innerText = 'Server error.';
        }
    }

    function copyEmail() {
        const statusText = document.getElementById('assignedEmailStatus').innerText;
        if (statusText.includes('Assigned Email: ')) {
            const email = statusText.replace('Assigned Email: ', '').trim();
            navigator.clipboard.writeText(email);
            alert('Copied to clipboard: ' + email);
        } else {
            alert('No email assigned to copy.');
        }
    }
</script>

</body>
</html>
