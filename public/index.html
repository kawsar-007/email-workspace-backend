<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Generator Workspace</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f6f9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .card { border: none; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .btn-custom { padding: 10px 20px; font-weight: 600; }
    </style>
</head>
<body class="py-5">

<div class="container" style="max-width: 600px;">

    <!-- Card 1: Generate Emails -->
    <div class="card p-4 mb-4">
        <h4 class="card-title text-center mb-3">1. Generate Valid Emails</h4>
        
        <div class="mb-3">
            <input type="number" id="emailCount" class="form-control" value="3" min="1" max="50">
        </div>

        <div class="mb-3">
            <select id="domainSelect" class="form-select">
                <option value="all">All Domains</option>
                <option value="gmail.com">gmail.com</option>
                <option value="yahoo.com">yahoo.com</option>
                <option value="outlook.com">outlook.com</option>
                <option value="hotmail.com">hotmail.com</option>
                <option value="icloud.com">icloud.com</option>
                <option value="mail.com">mail.com</option>
                <option value="zoho.com">zoho.com</option>
                <option value="proton.me">proton.me</option>
                <option value="protonmail.com">protonmail.com</option>
                <option value="gmx.com">gmx.com</option>
                <option value="yandex.com">yandex.com</option>
                <option value="aol.com">aol.com</option>
                <option value="live.com">live.com</option>
                <option value="msn.com">msn.com</option>
                <option value="inbox.com">inbox.com</option>
                <option value="fastmail.com">fastmail.com</option>
                <option value="hushmail.com">hushmail.com</option>
                <option value="lycos.com">lycos.com</option>
                <option value="rediffmail.com">rediffmail.com</option>
                <option value="comcast.net">comcast.net</option>
                <option value="sbcglobal.net">sbcglobal.net</option>
            </select>
        </div>

        <button id="btnGenerate" class="btn btn-success btn-custom w-100">Generate Emails</button>

        <div id="generateMessage" class="mt-3 text-center" style="display: none;"></div>
    </div>

    <!-- Card 2: Get Device Email -->
    <div class="card p-4">
        <h4 class="card-title text-center mb-3">2. Assign Email for Device</h4>

        <div class="mb-3">
            <input type="text" id="deviceId" class="form-control text-center bg-light" readonly>
        </div>

        <button id="btnGetEmail" class="btn btn-primary btn-custom w-100">Get New Email</button>

        <div id="fetchMessage" class="mt-3 text-center" style="display: none;"></div>
    </div>

</div>

<script>
    let deviceId = localStorage.getItem('device_id');
    if (!deviceId) {
        deviceId = 'DEV-' + Math.random().toString(36).substring(2, 10).toUpperCase() + '-' + Date.now();
        localStorage.setItem('device_id', deviceId);
    }
    document.getElementById('deviceId').value = `Device ID: ${deviceId}`;

    const API_BASE = window.location.origin;

    document.getElementById('btnGenerate').addEventListener('click', async () => {
        const count = document.getElementById('emailCount').value;
        const domain = document.getElementById('domainSelect').value;
        const msgDiv = document.getElementById('generateMessage');
        
        msgDiv.className = 'alert alert-info mt-3 text-center';
        msgDiv.style.display = 'block';
        msgDiv.innerText = 'Validating and generating emails... Please wait.';

        try {
            const res = await fetch(`${API_BASE}/api/generate-emails`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ count: parseInt(count), domain })
            });
            const data = await res.json();

            if (data.success) {
                msgDiv.className = 'alert alert-success mt-3 text-center';
                msgDiv.innerText = data.message;
            } else {
                msgDiv.className = 'alert alert-danger mt-3 text-center';
                msgDiv.innerText = data.error || 'Failed to generate emails.';
            }
        } catch (err) {
            msgDiv.className = 'alert alert-danger mt-3 text-center';
            msgDiv.innerText = 'Server connection error. Please try again.';
        }
    });

    document.getElementById('btnGetEmail').addEventListener('click', async () => {
        const msgDiv = document.getElementById('fetchMessage');
        msgDiv.className = 'alert alert-info mt-3 text-center';
        msgDiv.style.display = 'block';
        msgDiv.innerText = 'Fetching fresh email...';

        try {
            const res = await fetch(`${API_BASE}/api/get-email`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ deviceId })
            });
            const data = await res.json();

            if (data.success) {
                msgDiv.className = 'alert alert-success mt-3 text-center fw-bold';
                msgDiv.innerText = `Assigned Email: ${data.email}`;
            } else {
                msgDiv.className = 'alert alert-danger mt-3 text-center';
                msgDiv.innerText = data.error || 'No available emails found. Generate some first!';
            }
        } catch (err) {
            msgDiv.className = 'alert alert-danger mt-3 text-center';
            msgDiv.innerText = 'Server error occurred.';
        }
    });
</script>
</body>
</html>
