<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Distribution System</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f9; padding: 20px; text-align: center; }
        .card { background: white; max-width: 500px; margin: 20px auto; padding: 25px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        input, select, button { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button { background: #28a745; color: white; border: none; font-weight: bold; cursor: pointer; }
        button:hover { background: #218838; }
        .btn-get { background: #007bff; }
        .btn-get:hover { background: #0056b3; }
        .result { margin-top: 15px; padding: 10px; border-radius: 5px; font-weight: bold; word-break: break-all; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .info { background: #e2e3e5; color: #383d41; }
    </style>
</head>
<body>

    <!-- Email Generation Panel -->
    <div class="card">
        <h3>১. নতুন ভ্যালিড ইমেইল তৈরি করুন</h3>
        <input type="number" id="genCount" value="3" min="1" max="10" placeholder="কতটি ইমেইল চান?">
        <select id="genDomainSelect" onchange="toggleCustomDomain()">
            <option value="gmail.com">gmail.com</option>
            <option value="yahoo.com">yahoo.com</option>
            <option value="outlook.com">outlook.com</option>
            <option value="custom">Custom Domain</option>
        </select>
        <input type="text" id="genDomainCustom" placeholder="customdomain.com" style="display:none;">
        <button onclick="generateEmails()">SMTP চেক করে ইমেইল তৈরি করুন</button>
        <div id="genStatus" class="result" style="display:none;"></div>
    </div>

    <!-- Get New Email Panel -->
    <div class="card">
        <h3>২. ডিভাইসের জন্য ইমেইল সংগ্রহ করুন</h3>
        <div class="result info">Device ID: <span id="displayDeviceId">লোডিং...</span></div>
        <button class="btn-get" onclick="getDeviceEmail()">নতুন ইমেইল নিন</button>
        <div id="getEmailStatus" class="result" style="display:none;"></div>
    </div>

    <script>
        // Unique Hardware Device Identifier (Local Fallback Included)
        function getDeviceId() {
            let id = localStorage.getItem('app_device_id');
            if (!id) {
                id = 'DEV-' + Math.random().toString(36).substring(2, 9).toUpperCase() + '-' + Date.now();
                localStorage.setItem('app_device_id', id);
            }
            return id;
        }

        document.getElementById('displayDeviceId').innerText = getDeviceId();

        function toggleCustomDomain() {
            const select = document.getElementById('genDomainSelect').value;
            document.getElementById('genDomainCustom').style.display = (select === 'custom') ? 'block' : 'none';
        }

        async function generateEmails() {
            const count = document.getElementById('genCount').value || 3;
            const domainSelect = document.getElementById('genDomainSelect').value;
            const domain = (domainSelect === 'custom') ? document.getElementById('genDomainCustom').value.trim() : domainSelect;
            const statusDiv = document.getElementById('genStatus');

            statusDiv.style.display = 'block';
            statusDiv.className = 'result info';
            statusDiv.innerText = 'লাইভ SMTP ভ্যালিডিটি চেক করা হচ্ছে... একটু অপেক্ষা করুন।';

            try {
                const res = await fetch('/api/generate-emails', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ count: parseInt(count), domain })
                });
                const data = await res.json();
                
                if (data.success) {
                    statusDiv.className = 'result success';
                    statusDiv.innerText = data.message;
                } else {
                    statusDiv.className = 'result error';
                    statusDiv.innerText = data.error || 'ইমেইল ফিল্টার করতে সমস্যা হয়েছে।';
                }
            } catch (err) {
                statusDiv.className = 'result error';
                statusDiv.innerText = 'সার্ভারের সাথে সংযোগ স্থাপন করা সম্ভব হয়নি।';
            }
        }

        async function getDeviceEmail() {
            const deviceId = getDeviceId();
            const statusDiv = document.getElementById('getEmailStatus');

            statusDiv.style.display = 'block';
            statusDiv.className = 'result info';
            statusDiv.innerText = 'নতুন ইমেইল লোড হচ্ছে...';

            try {
                const res = await fetch('/api/get-device-email', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ deviceId })
                });
                const data = await res.json();

                if (data.success) {
                    statusDiv.className = 'result success';
                    statusDiv.innerText = `আপনার নতুন ইমেইল: ${data.email}`;
                } else {
                    statusDiv.className = 'result error';
                    statusDiv.innerText = data.error;
                }
            } catch (err) {
                statusDiv.className = 'result error';
                statusDiv.innerText = 'সার্ভার এরর। চেষ্টা আবার করুন।';
            }
        }
    </script>
</body>
</html>
